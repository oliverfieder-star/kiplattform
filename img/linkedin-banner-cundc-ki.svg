<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" font-family="'Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04141b"/>
      <stop offset="0.55" stop-color="#071a25"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.18" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.82" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPk" cx="0.62" cy="0.85" r="0.32">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#bgGrad)"/>
  <rect width="1584" height="396" fill="url(#dots)"/>
  <rect width="1584" height="396" fill="url(#glowC)"/>
  <rect width="1584" height="396" fill="url(#glowP)"/>
  <rect width="1584" height="396" fill="url(#glowPk)"/>

  <!-- Subtle horizon line -->
  <line x1="0" y1="395" x2="1584" y2="395" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- ===== LEFT: C&C mark + small tag ===== -->
  <g transform="translate(120,198)">
    <circle r="92" fill="none" stroke="url(#brand)" stroke-width="6" stroke-opacity="0.95"/>
    <circle r="92" fill="none" stroke="url(#brand)" stroke-width="14" stroke-opacity="0.18" filter="url(#soft)"/>
    <!-- mouth of the C opens to the right -->
    <path d="M 28 -64 L 96 -64 L 96 64 L 28 64 Z" fill="#04141b"/>
    <!-- inner mini-dot at C focus -->
    <circle cx="-12" cy="0" r="4" fill="url(#brand)"/>
  </g>

  <g transform="translate(120,316)" text-anchor="middle">
    <text font-size="11" letter-spacing="3.2" fill="#22d3ee" font-weight="600">CONTACT &amp; COOPERATION</text>
    <text y="16" font-size="10.5" letter-spacing="2.6" fill="#7b95a7" font-weight="500">WÜRZBURG · E.V.</text>
  </g>

  <!-- ===== CENTER: headline + claim ===== -->
  <g transform="translate(266,0)">
    <!-- Eyebrow -->
    <g transform="translate(0,124)">
      <rect x="0" y="-12" width="36" height="2" rx="1" fill="url(#brand)"/>
      <text x="48" y="-6" font-size="14.5" letter-spacing="3.4" fill="#22d3ee" font-weight="600">KI &amp; DIGITALISIERUNG</text>
    </g>

    <!-- Main claim -->
    <text x="0" y="218" font-size="92" font-weight="700" letter-spacing="-1.5" fill="#ffffff">
      KI für <tspan fill="url(#brand)">KMU</tspan>.
    </text>

    <!-- Sub claim -->
    <text x="0" y="278" font-size="32" font-weight="500" letter-spacing="0.1" fill="#aebbc7">
      Aus Würzburg <tspan fill="#5e6f7c">·</tspan> für die Region.
    </text>

    <!-- Tagline bar -->
    <g transform="translate(0,318)">
      <rect x="0" y="0" width="6" height="22" rx="2" fill="url(#brand)"/>
      <text x="18" y="16" font-size="13.5" letter-spacing="2.4" fill="#7b95a7" font-weight="500">Studentische Unternehmensberatung · seit 1990</text>
    </g>
  </g>

  <!-- ===== RIGHT: neural network pattern ===== -->
  <g transform="translate(1110,52)">
    <!-- Connecting lines (input -> hidden -> output) -->
    <g stroke="url(#brandSoft)" stroke-width="1.1" stroke-opacity="0.55" fill="none">
      <!-- input col x=0, hidden col x=170, output col x=340 -->
      <!-- 4 input -> 5 hidden -->
      <line x1="0" y1="40"  x2="170" y2="20"/>
      <line x1="0" y1="40"  x2="170" y2="85"/>
      <line x1="0" y1="40"  x2="170" y2="150"/>
      <line x1="0" y1="40"  x2="170" y2="215"/>
      <line x1="0" y1="40"  x2="170" y2="280"/>

      <line x1="0" y1="115" x2="170" y2="20"/>
      <line x1="0" y1="115" x2="170" y2="85"/>
      <line x1="0" y1="115" x2="170" y2="150"/>
      <line x1="0" y1="115" x2="170" y2="215"/>
      <line x1="0" y1="115" x2="170" y2="280"/>

      <line x1="0" y1="190" x2="170" y2="20"/>
      <line x1="0" y1="190" x2="170" y2="85"/>
      <line x1="0" y1="190" x2="170" y2="150"/>
      <line x1="0" y1="190" x2="170" y2="215"/>
      <line x1="0" y1="190" x2="170" y2="280"/>

      <line x1="0" y1="265" x2="170" y2="20"/>
      <line x1="0" y1="265" x2="170" y2="85"/>
      <line x1="0" y1="265" x2="170" y2="150"/>
      <line x1="0" y1="265" x2="170" y2="215"/>
      <line x1="0" y1="265" x2="170" y2="280"/>

      <!-- 5 hidden -> 3 output -->
      <line x1="170" y1="20"  x2="340" y2="80"/>
      <line x1="170" y1="20"  x2="340" y2="155"/>
      <line x1="170" y1="20"  x2="340" y2="230"/>
      <line x1="170" y1="85"  x2="340" y2="80"/>
      <line x1="170" y1="85"  x2="340" y2="155"/>
      <line x1="170" y1="85"  x2="340" y2="230"/>
      <line x1="170" y1="150" x2="340" y2="80"/>
      <line x1="170" y1="150" x2="340" y2="155"/>
      <line x1="170" y1="150" x2="340" y2="230"/>
      <line x1="170" y1="215" x2="340" y2="80"/>
      <line x1="170" y1="215" x2="340" y2="155"/>
      <line x1="170" y1="215" x2="340" y2="230"/>
      <line x1="170" y1="280" x2="340" y2="80"/>
      <line x1="170" y1="280" x2="340" y2="155"/>
      <line x1="170" y1="280" x2="340" y2="230"/>
    </g>

    <!-- Active highlight paths -->
    <g stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.95" fill="none" filter="url(#nodeGlow)">
      <line x1="0" y1="115" x2="170" y2="150"/>
      <line x1="170" y1="150" x2="340" y2="155"/>
    </g>
    <g stroke="#ec4899" stroke-width="1.6" stroke-opacity="0.9" fill="none" filter="url(#nodeGlow)">
      <line x1="0" y1="190" x2="170" y2="215"/>
      <line x1="170" y1="215" x2="340" y2="230"/>
    </g>

    <!-- Nodes: input column -->
    <g>
      <circle cx="0" cy="40"  r="6" fill="#0a1f2e" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="0" cy="115" r="6" fill="#22d3ee" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="190" r="6" fill="#ec4899" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="265" r="6" fill="#0a1f2e" stroke="#22d3ee" stroke-width="2"/>
    </g>
    <!-- Nodes: hidden column -->
    <g>
      <circle cx="170" cy="20"  r="6" fill="#0a1f2e" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="170" cy="85"  r="6" fill="#0a1f2e" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="170" cy="150" r="7" fill="#22d3ee" filter="url(#nodeGlow)"/>
      <circle cx="170" cy="215" r="7" fill="#ec4899" filter="url(#nodeGlow)"/>
      <circle cx="170" cy="280" r="6" fill="#0a1f2e" stroke="#8b5cf6" stroke-width="2"/>
    </g>
    <!-- Nodes: output column -->
    <g>
      <circle cx="340" cy="80"  r="6" fill="#0a1f2e" stroke="#ec4899" stroke-width="2"/>
      <circle cx="340" cy="155" r="8" fill="#22d3ee" filter="url(#nodeGlow)"/>
      <circle cx="340" cy="230" r="8" fill="#ec4899" filter="url(#nodeGlow)"/>
    </g>
  </g>

  <!-- Right-edge faint vertical accent -->
  <line x1="1554" y1="34" x2="1554" y2="362" stroke="url(#brand)" stroke-width="1.4" stroke-opacity="0.35"/>
</svg>
