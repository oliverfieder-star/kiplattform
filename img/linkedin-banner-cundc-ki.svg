<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" font-family="'Open Sans','Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#184d68"/>
      <stop offset="1" stop-color="#236f97"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.7" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#lift)"/>

  <!-- ===== TOP-LEFT: wordmark + tagline (PDF-style) ===== -->
  <g transform="translate(96,72)">
    <text x="0" y="0" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.2">Contact &amp; Cooperation</text>
    <text x="0" y="24" font-size="11" font-weight="600" fill="#a5c8de" letter-spacing="3.2">WÜRZBURG E.V. · STUDENTISCHE UNTERNEHMENSBERATUNG</text>
  </g>

  <!-- thin horizontal accent line under wordmark -->
  <line x1="96" y1="124" x2="160" y2="124" stroke="#7dc1e0" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== MAIN CLAIM ===== -->
  <g transform="translate(96,0)">
    <!-- Eyebrow -->
    <text x="0" y="206" font-size="13" font-weight="600" fill="#a5c8de" letter-spacing="3.4">KI &amp; DIGITALISIERUNG</text>

    <!-- Main headline -->
    <text x="0" y="288" font-size="96" font-weight="700" letter-spacing="-2.5" fill="#ffffff">
      KI für <tspan fill="#7dc1e0">KMU</tspan>.
    </text>

    <!-- Sub claim -->
    <text x="0" y="340" font-size="30" font-weight="400" fill="#cfe2f0">Aus Würzburg <tspan fill="#7dc1e0">·</tspan> für die Region.</text>
  </g>

  <!-- ===== BOTTOM-RIGHT: web tag ===== -->
  <g transform="translate(1488,348)" text-anchor="end">
    <text font-size="14" font-weight="600" fill="#7dc1e0" letter-spacing="0.6">www.cundc.org</text>
    <text y="22" font-size="11" font-weight="500" fill="#a5c8de" letter-spacing="2.4">SEIT 1990 · SANDERRING 2 · WÜRZBURG</text>
  </g>
</svg>
